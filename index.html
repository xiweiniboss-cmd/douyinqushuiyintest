<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>抖音无水印解析下载</title>
<style>
:root{ --pink:#FE2C55; --cyan:#25F4EE; --bg:#0f0f13; --card:#1a1a21; --text:#f1f1f3; --muted:#9a9aa3; }
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body{ margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; }
.wrap{ max-width:640px; margin:0 auto; padding:20px 16px 60px; }
header{ text-align:center; margin:26px 0 20px; }
header h1{ font-size:26px; margin:0 0 8px; font-weight:800; letter-spacing:1px; }
header h1 .dy{ color:var(--text); text-shadow:2px 2px 0 var(--pink), -2px -2px 0 var(--cyan); }
header h1 .dl{ color:var(--pink); }
header p{ color:var(--muted); font-size:13px; margin:0; }
.card{ background:var(--card); border-radius:16px; padding:18px 16px; margin-top:16px; box-shadow:0 4px 20px rgba(0,0,0,.35); }
textarea{ width:100%; min-height:88px; background:#101016; border:1px solid #2c2c36; border-radius:12px; color:var(--text); font-size:14px; padding:12px; resize:vertical; outline:none; }
textarea:focus{ border-color:var(--pink); }
.btn{ display:block; width:100%; margin-top:12px; padding:14px; border:none; border-radius:12px; font-size:16px; font-weight:700; color:#fff; background:linear-gradient(135deg,var(--pink),#ff6b4a); cursor:pointer; }
.btn:disabled{ opacity:.55; }
.btn.ghost{ background:#2a2a34; margin-top:10px; font-size:14px; font-weight:500; }
.hint{ font-size:12px; color:var(--muted); margin-top:10px; line-height:1.8; }
#result{ display:none; }
video#preview{ width:100%; max-height:60vh; border-radius:12px; background:#000; }
.title{ font-size:14px; line-height:1.6; margin:10px 0 12px; word-break:break-word; }
.grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:12px; }
.grid img{ width:100%; aspect-ratio:3/4; object-fit:cover; border-radius:8px; background:#101016; }
.err{ display:none; background:rgba(254,44,85,.12); border:1px solid rgba(254,44,85,.4); color:#ff8ba0; font-size:13px; border-radius:12px; padding:12px; margin-top:14px; line-height:1.7; word-break:break-word; }
.loading{ display:none; text-align:center; color:var(--muted); font-size:13px; margin-top:14px; }
footer{ text-align:center; color:#55555f; font-size:11px; margin-top:30px; line-height:1.8; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="dy">抖音</span> <span class="dl">无水印下载</span></h1>
    <p>粘贴分享链接，一键保存无水印视频 / 图片</p>
  </header>

  <div class="card">
    <textarea id="urlInput" placeholder="在此粘贴抖音分享链接&#10;例如：https://v.douyin.com/xxxx/"></textarea>
    <div style="display:flex;gap:10px;margin-top:12px">
      <button class="btn ghost" id="pasteBtn" style="margin-top:0;flex:1">📋 一键粘贴</button>
      <button class="btn" id="parseBtn" style="margin-top:0;flex:2">开始解析</button>
    </div>
    <div class="hint">📋 在抖音 App 点「分享」→「复制链接」，粘贴到这里即可<br>🔒 仅解析公开作品，请勿用于侵权用途</div>
  </div>

  <div class="loading" id="loading">解析中，请稍候…</div>
  <div class="err" id="err"></div>

  <div class="card" id="result">
    <div class="title" id="resTitle"></div>
    <div id="mediaBox"></div>
    <button class="btn" id="dlBtn" style="display:none">⬇ 一键下载无水印视频</button>
    <div class="hint" id="dlHint" style="display:none">iPhone 会弹出分享菜单，点「存储视频」即可保存到相册</div>
  </div>

  <footer>解析仅供个人学习交流<br>请勿传播他人原创作品<br><a href="javascript:void(0)" id="diagLink" style="color:#55555f;font-size:11px">🔧 网络诊断</a></footer>
</div>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var urlInput = $('urlInput'), parseBtn = $('parseBtn'), loading = $('loading'),
      errBox = $('err'), resultBox = $('result'), mediaBox = $('mediaBox'),
      dlBtn = $('dlBtn'), dlHint = $('dlHint');

  // 一键粘贴：从剪贴板读取分享链接
  $('pasteBtn').onclick = function(){
    hideError();
    if(navigator.clipboard && navigator.clipboard.readText){
      navigator.clipboard.readText().then(function(t){
        if(t && t.trim()){ urlInput.value = t.trim(); }
        else showError('剪贴板是空的，请先去抖音 App 复制分享链接');
      }).catch(function(){
        showError('无法读取剪贴板，请手动长按输入框粘贴（iPhone 请允许 Safari 访问剪贴板）');
      });
    } else {
      showError('当前浏览器不支持一键粘贴，请手动长按输入框粘贴');
    }
  };

  // 下载代理：Safari 不允许页面伪造跨域 Referer（实测会被忽略），
  // 而抖音 CDN 强校验 Referer，所以媒体下载一律走同源的 /api/dl 代理，
  // 由 Worker 代为设置 Referer 头下载后转交前端。
  function dlProxy(u, filename){
    return '/api/dl?url=' + encodeURIComponent(u) + '&filename=' + encodeURIComponent(filename || 'video.mp4');
  }
  function dyFetch(u, filename){
    return fetch(dlProxy(u, filename));
  }
  // 诊断用：直接请求，验证浏览器 referrer 选项行为
  var DY_REFERER = 'https://www.douyin.com/';
  function rawDyFetch(u){
    return fetch(u, { referrer: DY_REFERER, referrerPolicy: 'unsafe-url' });
  }
  function fileName(base, ext){
    return 'douyin_' + String(base).replace(/[^\w\-]+/g, '_').slice(0, 40) + '.' + ext;
  }
  function showError(html){
    errBox.style.display = 'block';
    errBox.innerHTML = html;
  }
  function hideError(){ errBox.style.display = 'none'; errBox.innerHTML = ''; }
  function setParseBtn(t, disabled){
    parseBtn.textContent = t;
    parseBtn.disabled = !!disabled;
  }
  function resetParseBtn(){ setParseBtn('开始解析', false); }

  // 一键下载：经 /api/dl 代理逐个地址尝试，成功则经系统分享保存（iPhone 弹出菜单）
  function downloadFile(url, filename, altUrls){
    var urls = [url].concat(altUrls || []);
    var idx = 0;
    var errLog = [];
    setParseBtn('正在准备下载…', true);

    function tryNext(){
      if(idx >= urls.length){
        resetParseBtn();
        window._dyDebugUrls = urls;
        showError('一键下载失败，各地址错误如下：<br>' + errLog.join('<br>') +
          '<br><br>💡 如果你开了 VPN（比如刚才下 TikTok 切的节点），<b>请先关掉 VPN 再试</b>：抖音 CDN 可能限制境外 IP 访问。<br>' +
          '💡 另外检查 <b>设置 → Apple ID → iCloud → 专用代理</b> 是否开着，开着的话 Safari 流量会走境外出口，也会导致 403，关掉再试。<br>' +
          '也可以稍后重试。<br><br><button class="btn ghost" style="margin-top:4px" onclick="navigator.clipboard.writeText(window._dyDebugUrls.join(\'\\n\')).then(function(){alert(\'已复制，请发给开发者分析\')})">📋 复制完整视频地址发我分析</button>');
        return;
      }
      var u = urls[idx];
      var curName = idx === 0 ? filename : fileName(filename.replace(/\.\w+$/, '') + '_' + idx, 'mp4');
      idx++;
      var shortUrl = u.length > 60 ? u.substring(0, 60) + '...' : u;
      dyFetch(u, curName).then(function(res){
        if(!res.ok) throw new Error('HTTP ' + res.status);
        return res.blob();
      }).then(function(blob){
        var file = new File([blob], filename, { type: blob.type || 'video/mp4' });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          resetParseBtn();
          return navigator.share({ files: [file], title: filename }).catch(function(){});
        }
        var objUrl = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = objUrl; a.download = filename;
        document.body.appendChild(a); a.click();
        setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(objUrl); }, 4000);
        resetParseBtn();
      }).catch(function(e){
        errLog.push('地址' + idx + ' (' + shortUrl + '): ' + (e.message || '网络错误'));
        tryNext();
      });
    }
    tryNext();
  }

  // 预览：经 /api/dl 代理取 blob，再转成本地 URL
  function blobUrl(u, filename){
    return dyFetch(u, filename).then(function(res){
      if(!res.ok) throw new Error('HTTP ' + res.status);
      return res.blob();
    }).then(function(blob){
      return URL.createObjectURL(blob);
    });
  }

  function renderResult(d){
    resultBox.style.display = 'block';
    $('resTitle').textContent = d.title || '（无标题）';
    mediaBox.innerHTML = '';
    dlBtn.style.display = 'none';
    dlHint.style.display = 'none';

    if(d.videos && d.videos.length){
      var v = document.createElement('video');
      v.id = 'preview'; v.controls = true; v.playsInline = true; v.preload = 'metadata';
      v.textContent = '视频加载中…';
      mediaBox.appendChild(v);
      blobUrl(d.videos[0], fileName(d.title || 'video', 'mp4')).then(function(objUrl){
        v.src = objUrl;
      }).catch(function(){
        v.textContent = '';
        v.poster = d.cover || '';
        showError('预览加载失败，但仍可尝试一键下载。');
      });
      dlBtn.style.display = 'block';
      dlHint.style.display = 'block';
      dlBtn.onclick = function(){ downloadFile(d.videos[0], fileName(d.title || 'video', 'mp4'), d.videos.slice(1)); };
    } else if(d.images && d.images.length){
      var grid = document.createElement('div');
      grid.className = 'grid';
      mediaBox.appendChild(grid);
      d.images.forEach(function(src, i){
        var img = document.createElement('img');
        img.alt = '图片' + (i + 1);
        img.loading = 'lazy';
        grid.appendChild(img);
        blobUrl(src, fileName((d.title || 'image') + '_' + (i + 1), 'jpg')).then(function(objUrl){ img.src = objUrl; }).catch(function(){});
        img.onclick = function(){
          blobUrl(src, fileName((d.title || 'image') + '_' + (i + 1), 'jpg')).then(function(objUrl){
            var a = document.createElement('a');
            a.href = objUrl; a.download = fileName((d.title || 'image') + '_' + (i + 1), 'jpg');
            document.body.appendChild(a); a.click();
            setTimeout(function(){ document.body.removeChild(a); }, 2000);
          }).catch(function(){ showError('图片下载失败，请稍后重试。'); });
        };
      });
      var tip = document.createElement('div');
      tip.className = 'hint';
      tip.textContent = '共 ' + d.images.length + ' 张图片，点击任意图片即可下载原图';
      mediaBox.appendChild(tip);
    } else {
      showError('解析成功但未找到可下载的媒体文件。');
    }
    resultBox.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // 网络诊断：验证 fetch 的 referrer 选项是否真的发出了 Referer 头（直接请求，不走代理）
  $('diagLink').onclick = function(){
    showError('诊断中…正在请求 httpbin.org/headers');
    rawDyFetch('https://httpbin.org/headers').then(function(res){
      return res.json();
    }).then(function(j){
      var h = j.headers || {};
      var referer = h.Referer || h.referer || '(无)';
      var ua = (h['User-Agent'] || '').slice(0, 60);
      showError('诊断结果：<br>对方收到的 Referer：<b>' + referer + '</b><br>User-Agent：' + ua +
        '<br><br>如果 Referer 显示"无"或不是 https://www.douyin.com/，说明浏览器没发出该头，这就是下载 403 的原因。');
    }).catch(function(e){
      showError('诊断请求失败：' + (e.message || '网络错误'));
    });
  };

  parseBtn.onclick = function(){
    var text = urlInput.value.trim();
    hideError();
    resultBox.style.display = 'none';
    if(!text){ showError('请先粘贴抖音分享链接'); return; }
    setParseBtn('解析中…', true);
    loading.style.display = 'block';
    fetch('/api/parse?url=' + encodeURIComponent(text))
      .then(function(r){ return r.text().then(function(t){
        var ct = r.headers.get('content-type') || '';
        if(!/json/i.test(ct)) throw new Error('服务异常（HTTP ' + r.status + '），请稍后重试');
        return JSON.parse(t);
      });})
      .then(function(data){
        loading.style.display = 'none';
        resetParseBtn();
        if(!data.ok) throw new Error(data.error || '解析失败');
        renderResult(data);
      })
      .catch(function(e){
        loading.style.display = 'none';
        resetParseBtn();
        var msg = String(e.message || '解析失败');
        if(/did not match the expected pattern|Unexpected token/i.test(msg))
          msg = '服务暂时不可用，请稍后重试';
        showError('解析失败：' + msg);
      });
  };
})();
</script>
</body>
</html>
